<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 232" width="100%" height="100%">
  <!-- Rounded Square Background -->
  <rect width="232" height="232" rx="42" ry="42" fill="#323c46" />
  
  <!-- House Roof -->
  <polyline points="26,105 116,36 206,105" stroke="#bea064" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- House Ceiling -->
  <line x1="38" y1="105" x2="194" y2="105" stroke="#bea064" stroke-width="7" stroke-linecap="round" />
  
  <!-- House Walls -->
  <line x1="48" y1="105" x2="48" y2="196" stroke="#bea064" stroke-width="7" stroke-linecap="round" />
  <line x1="184" y1="105" x2="184" y2="196" stroke="#bea064" stroke-width="7" stroke-linecap="round" />
  
  <!-- House Floor -->
  <line x1="26" y1="196" x2="206" y2="196" stroke="#bea064" stroke-width="9" stroke-linecap="round" />
  
  <!-- BE Serif Text -->
  <text x="116" y="168" font-family="'Playfair Display', 'Georgia', serif" font-size="58" font-weight="700" fill="#bea064" text-anchor="middle" letter-spacing="-1">BE</text>
</svg>